name: CI

# Epic 0: configure + build the JUCE + Tracktion Engine application on macOS and
# Ubuntu, then produce UNSIGNED release artifacts (STUDIO_SPEC §8.2/§8.3):
#   * macOS  -> raw-radio-studio-<version>-macos.dmg
#   * Linux  -> raw-radio-studio-<version>-x86_64.AppImage
#               raw-radio-studio-<version>-amd64.deb
# Pinned dependencies are checked out as git submodules at exact commits
# (non-recursive, see DEPENDENCIES.md). Artifacts are uploaded with
# actions/upload-artifact — this workflow does NOT create a GitHub Release
# (release automation is Epic 6).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04

    steps:
      - name: Checkout (with pinned submodules)
        uses: actions/checkout@v4
        with:
          # Non-recursive on purpose: Tracktion Engine's nested `modules/juce`
          # submodule uses an SSH URL and is deliberately NOT used — we pin JUCE
          # ourselves as a separate top-level submodule. See DEPENDENCIES.md.
          submodules: true

      - name: Install JUCE build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxi-dev \
            libxfixes-dev \
            libwebkit2gtk-4.1-dev \
            dpkg-dev \
            fakeroot

      - name: Show pinned dependency revisions
        run: git submodule status

      - name: Show toolchain versions
        run: |
          cmake --version
          c++ --version

      - name: Determine version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 -E '^[[:space:]]*VERSION[[:space:]]+[0-9]' CMakeLists.txt | awk '{print $2}')"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "error: could not determine project version" >&2
            exit 1
          fi
          echo "STUDIO_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "Packaging version: ${VERSION}"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # Bound parallelism: the amalgamated Tracktion Engine and JUCE translation
        # units are large and have been observed to OOM with unbounded `--parallel`
        # on resource-limited runners.
        run: cmake --build build --config Release --parallel 2

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: '"build/raw_radio_studio_artefacts/Release/raw-radio-studio.app/Contents/MacOS/raw-radio-studio" --version'

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: build/raw_radio_studio_artefacts/Release/raw-radio-studio --version

      - name: Run unit tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

      # --- Packaging --------------------------------------------------------
      # Unsigned artifacts only (notarization/code-signing deferred, §8.5).

      - name: Package macOS .dmg (unsigned)
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos/make-dmg.sh \
            "build/raw_radio_studio_artefacts/Release/raw-radio-studio.app" \
            "${STUDIO_VERSION}" \
            dist

      - name: Package Linux .deb (dpkg-deb, unsigned)
        if: runner.os == 'Linux'
        run: bash packaging/linux/make-deb.sh build "${STUDIO_VERSION}" dist

      - name: Package Linux AppImage (linuxdeploy, unsigned)
        if: runner.os == 'Linux'
        run: |
          bash packaging/linux/make-appimage.sh \
            "build/raw_radio_studio_artefacts/Release/raw-radio-studio" \
            "${STUDIO_VERSION}" \
            dist

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: raw-radio-studio-${{ env.STUDIO_VERSION }}-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: raw-radio-studio-${{ env.STUDIO_VERSION }}-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14
