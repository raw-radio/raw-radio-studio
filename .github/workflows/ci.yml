name: CI

# Epic 0: configure + build the JUCE + Tracktion Engine application on macOS and
# Ubuntu, then produce UNSIGNED release artifacts (STUDIO_SPEC §8.2/§8.3):
#   * macOS  -> raw-radio-studio-<version>-macos-arm64.dmg
#   * Linux  -> raw-radio-studio-<version>-x86_64.AppImage
#               raw-radio-studio-<version>-amd64.deb
# Pinned dependencies are checked out as git submodules at exact commits
# (non-recursive, see DEPENDENCIES.md).
#
# Compilation caching (ccache). The incremental win of CI comes almost entirely
# from the pinned JUCE + Tracktion Engine translation units — the bulk of the
# build — which never change as long as the submodule pinning does not. ccache is
# wired in as the CMake compiler launcher (`-DCMAKE_CXX_COMPILER_LAUNCHER=...`,
# injected on the command line so CMakeLists.txt stays untouched) and its
# directory is persisted between runs with actions/cache. ccache is
# content-addressed: a stale cache can only *miss*, never produce a wrong
# object, so the key is only a best-effort fingerprint (submodule pinning +
# CMakeLists.txt/DEPENDENCIES.md + branch) used to avoid restoring a cache that
# is guaranteed to be useless after a dependency bump. restore-keys walk back to
# an OS-only key so a branch still salvages another branch's cache.
#
# On branch/PR/dispatch runs the artifacts are uploaded with
# actions/upload-artifact only. Pushing a `v*` tag additionally runs the
# `release` job, which publishes the artifacts (with a sha256 `checksums.txt`)
# to a GitHub Release — the release-automation half of Epic 6 (§8.3; the
# auto-update half, Sparkle/AppImageUpdate, is still open — see
# docs/EPIC6_GAPS.md).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04

    env:
      # ccache configuration, shared by both matrix legs. CCACHE_DIR lives inside
      # the workspace so actions/cache can persist it with a single path; the
      # remaining knobs are the standard CI set — see the header comment.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "2G"
      CCACHE_SLOPPINESS: "time_macros,include_file_ctime,include_file_mtime"

    steps:
      - name: Checkout (with pinned submodules)
        uses: actions/checkout@v4
        with:
          # Non-recursive on purpose: Tracktion Engine's nested `modules/juce`
          # submodule uses an SSH URL and is deliberately NOT used — we pin JUCE
          # ourselves as a separate top-level submodule. See DEPENDENCIES.md.
          submodules: true

      - name: Fingerprint pinned dependencies
        id: deps
        shell: bash
        # The commit SHAs live in the git tree (gitlinks), not in .gitmodules, so
        # read them from `git submodule status` rather than hashing a file. This
        # hash only decides *which* cache we try to restore — ccache itself
        # guarantees correctness (content-addressed keys).
        run: echo "pins=$(git submodule status | git hash-object --stdin | cut -c1-16)" >> "${GITHUB_OUTPUT}"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.os }}-${{ steps.deps.outputs.pins }}-${{ hashFiles('CMakeLists.txt', 'DEPENDENCIES.md', '.gitmodules') }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ steps.deps.outputs.pins }}-${{ hashFiles('CMakeLists.txt', 'DEPENDENCIES.md', '.gitmodules') }}-
            ccache-${{ matrix.os }}-${{ steps.deps.outputs.pins }}-
            ccache-${{ matrix.os }}-

      - name: Install JUCE build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxi-dev \
            libxfixes-dev \
            libwebkit2gtk-4.1-dev \
            dpkg-dev \
            fakeroot

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        # The macOS runner image ships Homebrew but not ccache, so install it
        # (guarded: a no-op if the image ever starts bundling it). Auto-update is
        # disabled — HOMEBREW_NO_AUTO_UPDATE keeps this to a bottle install.
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "ccache already available: $(command -v ccache)"
          else
            brew install ccache
          fi

      - name: Reset ccache statistics
        run: |
          ccache --version | head -1
          ccache --zero-stats

      - name: Show pinned dependency revisions
        run: git submodule status

      - name: Show toolchain versions
        run: |
          cmake --version
          c++ --version

      - name: Determine version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 -E '^[[:space:]]*VERSION[[:space:]]+[0-9]' CMakeLists.txt | awk '{print $2}')"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "error: could not determine project version" >&2
            exit 1
          fi
          echo "STUDIO_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "Packaging version: ${VERSION}"

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        # Bound parallelism: the amalgamated Tracktion Engine and JUCE translation
        # units are large and have been observed to OOM with unbounded `--parallel`
        # on resource-limited runners.
        run: cmake --build build --config Release --parallel 2

      - name: Report ccache statistics
        # Diagnostics only: never let a stats failure redden an otherwise green
        # job (e.g. if ccache was never installed because a prior step failed).
        if: always()
        run: ccache --show-stats --verbose 2>/dev/null || ccache --show-stats || true

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: '"build/raw_radio_studio_artefacts/Release/raw-radio-studio.app/Contents/MacOS/raw-radio-studio" --version'

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: build/raw_radio_studio_artefacts/Release/raw-radio-studio --version

      - name: Run unit tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

      # --- Packaging --------------------------------------------------------
      # Unsigned artifacts only (notarization/code-signing deferred, §8.5).

      - name: Package macOS .dmg (unsigned)
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos/make-dmg.sh \
            "build/raw_radio_studio_artefacts/Release/raw-radio-studio.app" \
            "${STUDIO_VERSION}" \
            dist

      - name: Package Linux .deb (dpkg-deb, unsigned)
        if: runner.os == 'Linux'
        run: |
          bash packaging/linux/make-deb.sh \
            "build/raw_radio_studio_artefacts/Release/raw-radio-studio" \
            "${STUDIO_VERSION}" \
            dist

      - name: Package Linux AppImage (linuxdeploy, unsigned)
        if: runner.os == 'Linux'
        run: |
          bash packaging/linux/make-appimage.sh \
            "build/raw_radio_studio_artefacts/Release/raw-radio-studio" \
            "${STUDIO_VERSION}" \
            dist

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: raw-radio-studio-${{ env.STUDIO_VERSION }}-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: raw-radio-studio-${{ env.STUDIO_VERSION }}-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # Epic 7 (NFR-P-5): AddressSanitizer gate. Linux-only — ASan is wired for
  # GCC/Clang in CMakeLists.txt (RAW_RADIO_STUDIO_ENABLE_ASAN) and instruments
  # *our* targets only; the pinned JUCE/Tracktion submodules are out of scope.
  #
  # Final sanitizer policy (full rationale in docs/EPIC7_GAPS.md):
  #   * No ASan/LSan option is weakened. Every ASan detector — including
  #     alloc-dealloc-mismatch and leak detection — runs at its default.
  #   * The old `alloc_dealloc_mismatch=0` is gone. That report was a bug in our
  #     RT-safety probe (tests/test_integration.cpp overrode the throwing
  #     operator new/delete but left the *nothrow* forms at their default, so a
  #     `std::stable_sort` buffer was freed by the wrong operator). It is fixed
  #     at the source, so the detector stays enabled and nothing is masked.
  #   * The old `detect_leaks=0` is gone — leak detection stays ON. The single
  #     upstream one-shot leak (fontconfig -> juce::FTLibWrapper ->
  #     rrs::brand::initialiseFonts; a constant 320 B that never grows) is
  #     silenced by the narrow suppression tests/lsan.supp instead of disabling
  #     LSan for the whole binary.
  #   * That suppression is injected by CMakeLists.txt as a ctest *test
  #     property* (LSAN_OPTIONS=suppressions=<repo>/tests/lsan.supp, wired only
  #     when RAW_RADIO_STUDIO_ENABLE_ASAN=ON). This is why the gate runs the
  #     suite via `ctest` rather than the raw binaries: ctest picks the
  #     environment up automatically, so CI is byte-for-byte the documented
  #     local command, and no ASAN_OPTIONS/LSAN_OPTIONS is set in the workflow
  #     (setting one here would mask real defects).
  # UBSan is deliberately NOT enabled: it trips on a pre-existing Tracktion
  # Engine issue (tracktion_graph .../tracktion_Utility.h NaN -> long long)
  # long before it reaches our code, so a combined gate could never pass.
  # --------------------------------------------------------------------------
  asan:
    name: asan (linux)
    runs-on: ubuntu-24.04
    # ASan roughly doubles build/link time and the integration binary runs ~73 s
    # even un-instrumented; a generous ceiling avoids a premature kill.
    timeout-minutes: 60
    env:
      # Same ccache setup as `build`, but a separate directory/cache key: the
      # instrumented RelWithDebInfo objects are keyed differently by ccache
      # anyway, and an isolated dir keeps `ccache --show-stats` readable.
      CCACHE_DIR: ${{ github.workspace }}/.ccache-asan
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "2G"
      CCACHE_SLOPPINESS: "time_macros,include_file_ctime,include_file_mtime"
    steps:
      - name: Checkout (with pinned submodules)
        uses: actions/checkout@v4
        with:
          # Non-recursive on purpose: see the build job / DEPENDENCIES.md.
          submodules: true

      - name: Fingerprint pinned dependencies
        id: deps
        shell: bash
        run: echo "pins=$(git submodule status | git hash-object --stdin | cut -c1-16)" >> "${GITHUB_OUTPUT}"

      - name: Restore ccache (ASan)
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-asan-${{ steps.deps.outputs.pins }}-${{ hashFiles('CMakeLists.txt', 'DEPENDENCIES.md', '.gitmodules') }}-${{ github.ref_name }}
          restore-keys: |
            ccache-asan-${{ steps.deps.outputs.pins }}-${{ hashFiles('CMakeLists.txt', 'DEPENDENCIES.md', '.gitmodules') }}-
            ccache-asan-${{ steps.deps.outputs.pins }}-
            ccache-asan-

      - name: Install JUCE build dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxi-dev \
            libxfixes-dev \
            libwebkit2gtk-4.1-dev

      - name: Reset ccache statistics
        run: |
          ccache --version | head -1
          ccache --zero-stats

      - name: Configure (ASan)
        run: >
          cmake -S . -B build-asan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DRAW_RADIO_STUDIO_ENABLE_ASAN=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build instrumented test targets
        # ASan/RelWithDebInfo TUs are large; bound parallelism to avoid OOM on
        # standard runners (same rationale as the Release build job).
        run: >
          cmake --build build-asan --parallel 2
          --target raw_radio_studio_tests raw_radio_studio_integration_tests

      - name: Report ccache statistics (ASan)
        if: always()
        run: ccache --show-stats --verbose 2>/dev/null || ccache --show-stats || true

      - name: Run tests under ASan (CTest)
        # ctest applies the CMake-provided LSAN_OPTIONS=suppressions=… property
        # automatically; the workflow sets no ASAN_OPTIONS/LSAN_OPTIONS itself.
        run: ctest --test-dir build-asan --output-on-failure

  # --------------------------------------------------------------------------
  # Release automation (Epic 6, partial). On a `v*` tag push, collect the
  # artifacts produced by `build`, emit a sha256 `checksums.txt`, and
  # create/update the matching GitHub Release.
  #
  # `needs: [build, asan]` gates publication on the green ASan job: a red
  # memory-safety gate must block a release, not just warn (Epic 7 / NFR-P-5).
  # Wiring the dependency here — rather than via branch protection — means no
  # tag can be published while `asan` is red, with no external repo settings.
  #
  # The macOS .dmg is UNSIGNED — notarization/code-signing is deferred
  # (STUDIO_SPEC §8.5). The remaining Epic 6 work (Sparkle 2 appcast,
  # AppImageUpdate/zsync) is tracked in docs/EPIC6_GAPS.md.
  # --------------------------------------------------------------------------
  release:
    name: publish GitHub Release
    needs: [build, asan]
    # Never fire on PRs/branches/dispatch — only a `v*` tag deploys.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      # Required to create/update the Release. The token is provided by Actions
      # (github.token / GITHUB_TOKEN); no PAT or extra secret is used.
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # macOS + Linux artifacts were uploaded under distinct names; flatten
          # them into one directory (filenames are already unique per platform).
          merge-multiple: true

      - name: Generate checksums.txt (sha256)
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          # Checksum only the distributable binaries, not the manifest itself.
          mapfile -t files < <(find . -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -printf '%f\n' | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "error: no build artifacts found to checksum" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > checksums.txt
          echo "---- checksums.txt ----"
          cat checksums.txt

      - name: Create or update the GitHub Release (idempotent)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # gh has no git checkout in this job — tell it which repo to target.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd artifacts
          mapfile -t assets < <(find . -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \
               -o -name 'checksums.txt' \) -printf '%f\n' | sort)

          # Pre-release policy: `-alpha`/`-beta`/`-rc` tags are published as
          # GitHub pre-releases (every historical `vX.Y.Z-alpha` release was a
          # pre-release); any other tag is a normal release. Mirrors the manual
          # behaviour this automation replaces.
          prerelease=()
          case "${TAG}" in
            *-alpha*|*-beta*|*-rc*) prerelease=(--prerelease) ;;
          esac

          # Idempotency: re-running the workflow for an existing tag must not
          # fail. Update the assets in place with `--clobber` instead.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists — uploading assets (--clobber)"
            gh release upload "${TAG}" "${assets[@]}" --clobber
          else
            echo "creating release ${TAG}"
            gh release create "${TAG}" "${assets[@]}" \
              --title "raw-radio-studio ${TAG}" \
              --generate-notes \
              "${prerelease[@]}"
          fi
